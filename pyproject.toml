[project]
name = "calls-to-knowledge-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pycaw==20240210",
    "pyaudiowpatch==0.2.12.6",
    "openai>=1.50.0",
    "supabase>=2.9.0",
    "faster-whisper==1.1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "pytest-mock==3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
